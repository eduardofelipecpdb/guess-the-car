name: Atualização Diária de Carros (Shuffle)

on:
  schedule:
    # Executa todos os dias às 03:00 UTC (00:00 Horário de Brasília)
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shuffle-daily-cars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install beautifulsoup4

      - name: Executar Shuffle Diário (3 carros do dia)
        run: python scripts/daily_shuffle.py --force

      - name: Commit e Push dos novos carros do dia
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily.json data/shuffle_state.json data/game_data.js
          git diff --staged --quiet || git commit -m "chore: atualiza os 3 carros do dia (shuffle)"
          git push

